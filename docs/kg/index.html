<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Graph Visualization with Labels</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
      pointer-events: none;
    }
    #loading {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>

  <!-- WebGL Library Dependencies -->
  <script src="https://unpkg.com/3d-force-graph"></script>
  <script src="https://unpkg.com/three-spritetext"></script>
</head>
<body>

  <div id="info-panel">
    <div id="loading">Status: Loading graph data...</div>
    <div id="stats"></div>
  </div>

  <div id="3d-graph"></div>

  <script>
    const statusElem = document.getElementById('loading');
    const statsElem = document.getElementById('stats');
    const startTime = performance.now();

    // Color generation per group
    const colorMap = {};
    function getGroupColor(group) {
      if (!colorMap[group]) {
        const hash = String(group).split('').reduce((a, b) => {
          a = ((a << 5) - a) + b.charCodeAt(0);
          return a & a;
        }, 0);
        const hue = Math.abs(hash) % 360;
        colorMap[group] = `hsl(${hue}, 80%, 60%)`;
      }
      return colorMap[group];
    }

    fetch('graph_370k.json')
      .then(res => res.json())
      .then(data => {
        const fetchTime = ((performance.now() - startTime) / 1000).toFixed(2);
        statusElem.innerText = `Status: Processing rendering buffers... (${fetchTime}s fetch time)`;

        // 1. Unpack compact JSON nodes: [id, x, y, z, group]
        const nodes = data.nodes.map(n => ({
          id: n[0],
          fx: n[1],
          fy: n[2],
          fz: n[3],
          color: getGroupColor(n[4])
        }));

        // 2. Unpack compact JSON links: [source, target, label]
        const links = data.links.map(l => ({
          source: l[0],
          target: l[1],
          label: l[2]
        }));

        // 3. Initialize Graph with Sprites for Nodes and Links
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
          .graphData({ nodes, links })
          .nodeResolution(4)
          .nodeRelSize(2)
          .nodeColor(node => node.color)
          .linkOpacity(0.2)
          .linkWidth(0.5)
          .cooldownTicks(0)
          .enableNodeDrag(false)
          
          // --- NODE LABELS (ID rendered on/above the bubble) ---
          .nodeThreeObjectExtend(true)
          .nodeThreeObject(node => {
            const sprite = new SpriteText(node.id);
            sprite.color = '#ffffff';
            sprite.textHeight = 4; // Adjust size relative to WebGL space
            sprite.position.y = 4;  // Position slightly above the node center
            return sprite;
          })

          // --- LINK LABELS (Relationship text rendered along the edge) ---
          .linkThreeObjectExtend(true)
          .linkThreeObject(link => {
            const sprite = new SpriteText(link.label);
            sprite.color = 'rgba(200, 200, 200, 0.85)';
            sprite.textHeight = 2.5;
            return sprite;
          })
          .linkPositionUpdate((sprite, { start, end }) => {
            // Calculate midpoint of the relationship line
            const middlePos = Object.assign(...['x', 'y', 'z'].map(c => ({
              [c]: start[c] + (end[c] - start[c]) / 2 
            })));
            Object.assign(sprite.position, middlePos);
          });

        const renderTime = ((performance.now() - startTime) / 1000).toFixed(2);
        statusElem.style.color = '#55ff55';
        statusElem.innerText = 'Status: Render Complete';
        statsElem.innerHTML = `
          Nodes: <b>${nodes.length.toLocaleString()}</b><br>
          Links: <b>${links.length.toLocaleString()}</b><br>
          Load Time: <b>${renderTime}s</b>
        `;
      })
      .catch(err => {
        statusElem.style.color = '#ff5555';
        statusElem.innerText = 'Error loading graph_370k.json file.';
        console.error(err);
      });
  </script>
</body>
</html>
