<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Graph Visualization with Labels</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    #info-panel .no-pointer { pointer-events: none; }
    #loading {
      color: #00ffcc;
      font-weight: bold;
    }
    #controls {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }
    #controls label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #ccc;
    }
    #node-slider {
      width: 260px;
      cursor: pointer;
    }
    #node-count-value {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>

  <!-- WebGL Library Dependencies -->
  <!-- three must load first so three-spritetext can find its global THREE -->
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
</head>
<body>

  <div id="info-panel">
    <div class="no-pointer">
      <div id="loading">Status: Loading graph data...</div>
      <div id="stats"></div>
    </div>
    <div id="controls" style="display:none;">
      <label>Nodes shown: <span id="node-count-value">0</span> / <span id="node-count-total">0</span></label>
      <input type="range" id="node-slider" min="1" max="1" value="1" />
    </div>
  </div>

  <div id="3d-graph"></div>

  <script>
    const statusElem = document.getElementById('loading');
    const statsElem = document.getElementById('stats');
    const controlsElem = document.getElementById('controls');
    const sliderElem = document.getElementById('node-slider');
    const countValueElem = document.getElementById('node-count-value');
    const countTotalElem = document.getElementById('node-count-total');
    const startTime = performance.now();

    // Color generation per group
    const colorMap = {};
    function getGroupColor(group) {
      if (!colorMap[group]) {
        const hash = String(group).split('').reduce((a, b) => {
          a = ((a << 5) - a) + b.charCodeAt(0);
          return a & a;
        }, 0);
        const hue = Math.abs(hash) % 360;
        colorMap[group] = `hsl(${hue}, 80%, 60%)`;
      }
      return colorMap[group];
    }

    fetch('graph_370k.json')
      .then(res => res.json())
      .then(data => {
        const fetchTime = ((performance.now() - startTime) / 1000).toFixed(2);
        statusElem.innerText = `Status: Processing rendering buffers... (${fetchTime}s fetch time)`;

        // 1. Unpack compact JSON nodes: [id, x, y, z, group]
        const allNodes = data.nodes.map(n => ({
          id: n[0],
          fx: n[1],
          fy: n[2],
          fz: n[3],
          color: getGroupColor(n[4])
        }));

        // 2. Unpack compact JSON links: [source, target, label]
        const allLinks = data.links.map(l => ({
          source: l[0],
          target: l[1],
          label: l[2]
        }));

        const totalNodes = allNodes.length;
        const totalLinks = allLinks.length;

        // Build a lookup of node index by id, in original order (used as slider ordering).
        const nodeIndexById = new Map();
        allNodes.forEach((n, i) => nodeIndexById.set(n.id, i));

        // 3. Initialize Graph
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
          .nodeResolution(4)
          .nodeRelSize(2)
          .nodeColor(node => node.color)
          .linkOpacity(0.2)
          .linkWidth(0.5)
          .cooldownTicks(0)
          .enableNodeDrag(false)

          // --- NODE LABELS (ID rendered on/above the bubble) ---
          .nodeThreeObjectExtend(true)
          .nodeThreeObject(node => {
            const sprite = new SpriteText(node.id);
            sprite.color = '#ffffff';
            sprite.textHeight = 4;
            sprite.position.y = 4;
            return sprite;
          })

          // --- LINK LABELS (Relationship text rendered along the edge) ---
          .linkThreeObjectExtend(true)
          .linkThreeObject(link => {
            const sprite = new SpriteText(link.label);
            sprite.color = 'rgba(200, 200, 200, 0.85)';
            sprite.textHeight = 2.5;
            return sprite;
          })
          .linkPositionUpdate((sprite, { start, end }) => {
            const middlePos = Object.assign(...['x', 'y', 'z'].map(c => ({
              [c]: start[c] + (end[c] - start[c]) / 2
            })));
            Object.assign(sprite.position, middlePos);
          });

        function updateGraph(nodeCount) {
          const n = Math.max(1, Math.min(totalNodes, nodeCount | 0));
          const nodesSubset = allNodes.slice(0, n);
          const visibleIds = new Set(nodesSubset.map(node => node.id));
          const linksSubset = allLinks.filter(l => visibleIds.has(l.source) && visibleIds.has(l.target));

          Graph.graphData({ nodes: nodesSubset, links: linksSubset });

          countValueElem.textContent = n.toLocaleString();
          statsElem.innerHTML = `
            Nodes: <b>${nodesSubset.length.toLocaleString()}</b> / ${totalNodes.toLocaleString()}<br>
            Links: <b>${linksSubset.length.toLocaleString()}</b> / ${totalLinks.toLocaleString()}
          `;
        }

        // Configure slider: 1 .. totalNodes, default = min(1000, totalNodes)
        const initialCount = Math.min(1000, totalNodes);
        sliderElem.min = 1;
        sliderElem.max = totalNodes;
        sliderElem.value = initialCount;
        countTotalElem.textContent = totalNodes.toLocaleString();
        controlsElem.style.display = 'block';

        // Debounce slider input so dragging doesn't thrash the renderer.
        let sliderTimer = null;
        sliderElem.addEventListener('input', () => {
          countValueElem.textContent = (+sliderElem.value).toLocaleString();
          clearTimeout(sliderTimer);
          sliderTimer = setTimeout(() => updateGraph(+sliderElem.value), 120);
        });

        updateGraph(initialCount);

        const renderTime = ((performance.now() - startTime) / 1000).toFixed(2);
        statusElem.style.color = '#55ff55';
        statusElem.innerText = `Status: Render Complete (${renderTime}s)`;
      })
      .catch(err => {
        statusElem.style.color = '#ff5555';
        statusElem.innerText = 'Error loading graph_370k.json file.';
        console.error(err);
      });
  </script>
</body>
</html>
